# Thai — espeak th conventions
code: th
name: Thai
espeak_voice: th
translate:
  google: th
  mymemory: th-TH
tts_voice: th-TH-PremwadeeNeural

consonants: [p, b, t, d, k, ɡ, ʔ, ph, th, kh, ch, f, s, h, m, n, ŋ, nɡ, l, r, ɹ, j, w]
vowels: [a, i, u, e, o, ɜ, ɛ, ɔ, ɯ, ɤ, eː, uː, iː, oː, aɪ, aʊ]

# How Thai natively writes each of its own sounds.
