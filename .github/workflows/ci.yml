name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # espeak-ng is the G2P engine (phonemizer shells out to it); the
      # runner image doesn't ship it
      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      # torch from the CPU index keeps the install (and the job) small
      - name: Install dependencies
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # verifies the Dockerfile builds without baking the ~2.5 GB of
      # model weights; release.yml does the full bake when tagging
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            BAKE_MODELS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
