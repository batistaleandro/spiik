services:
  spiik:
    # pull a released image instead of building:
    #   SPIIK_IMAGE=ghcr.io/batistaleandro/spiik:v0.4.0 docker compose up -d
    build: .
    image: ${SPIIK_IMAGE:-spiik:latest}
    ports:
      - "${PORT:-8900}:8000"
    environment:
      # local wav2vec2 (default) | azure (needs AZURE_SPEECH_KEY/REGION)
      SPIIK_ENGINE: ${SPIIK_ENGINE:-local}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      # JWT signing secret — set this to a long random string in production;
      # if left empty, one is generated and stored in /data on first start
      SPIIK_SECRET: ${SPIIK_SECRET:-}
      # number of uvicorn worker processes (CPU-bound inference scales
      # with this; each worker loads its own model copies — see README)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # email of the account promoted to operator (admin panel) at startup,
      # e.g. SPIIK_ADMIN_EMAIL=you@example.com
      SPIIK_ADMIN_EMAIL: ${SPIIK_ADMIN_EMAIL:-}
      # password recovery emails: plain SMTP account, no paid service needed.
      # Without SPIIK_SMTP_HOST the reset link is written to the logs instead
      SPIIK_SMTP_HOST: ${SPIIK_SMTP_HOST:-}
      SPIIK_SMTP_PORT: ${SPIIK_SMTP_PORT:-587}
      SPIIK_SMTP_USER: ${SPIIK_SMTP_USER:-}
      SPIIK_SMTP_PASSWORD: ${SPIIK_SMTP_PASSWORD:-}
      SPIIK_SMTP_FROM: ${SPIIK_SMTP_FROM:-spiik@localhost}
      # base URL used in emailed links, e.g. https://spiik.example.com
      SPIIK_APP_URL: ${SPIIK_APP_URL:-}
    volumes:
      # named volume seeded from the baked-in model; survives container rebuilds
      - hf-cache:/cache/huggingface
      # SQLite database (users, saved words, review history) + generated secret
      - spiik-data:/data
    restart: unless-stopped

  # ---- observability (opt-in) ----------------------------------------------
  # docker compose --profile observability up -d
  # Prometheus: http://localhost:9090 · Grafana: http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.1
    profiles: ["observability"]
    environment:
      # admin/admin unless overridden — change it on any exposed instance
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  hf-cache:
  spiik-data:
  prometheus-data:
  grafana-data:
